name: Test ricambi Amazon

# Job usa-e-getta: verifica se lo scraping di Amazon.it funziona dal runner GitHub
# (utile per diagnosticare i blocchi lato IP datacenter). Lanciare a mano da Actions.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Trova Chrome
        id: chrome
        run: echo "path=$(which google-chrome-stable || which chromium-browser)" >> "$GITHUB_OUTPUT"
      - name: Prova searchAmazonPart
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          node -e '
          const puppeteer = require("puppeteer-core");
          const { searchAmazonPart } = require("./amazon_search.js");
          (async () => {
            const b = await puppeteer.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ["--no-sandbox","--disable-dev-shm-usage"] });
            const p = await b.newPage();
            for (const q of ["stick analogico ricambio dualsense ps5", "alimentatore interno ps4 slim"]) {
              try {
                const r = await searchAmazonPart(p, q);
                console.log("OK  |", q, "=>", JSON.stringify(r));
              } catch (e) {
                console.log("ERR |", q, "=>", e.message, e.isAmazonBlocked ? "[BLOCCATO]" : "");
              }
            }
            await b.close();
          })();
          '
