name: Watchdog bot

# Job minuscolo (niente Chrome, niente npm), gira ogni ~15 minuti. Verifica che
# bot.yml sia attivo; se e' fermo da troppo tempo avvisa su Telegram e lo riavvia.
# E' anche lui un cron GitHub e quindi non e' garantito al 100%, ma essendo brevissimo
# e frequente ha molte piu' probabilita' di partire regolarmente del job lungo del bot.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  # Si attiva anche appena bot.yml finisce un ciclo: se GitHub non avvia subito
  # il job successivo (il cron a volte salta per ore), il watchdog se ne accorge
  # in quel momento e lo riavvia, senza aspettare il prossimo */15 (che potrebbe
  # essere saltato anch'esso). Cosi' il bot si auto-concatena. La protezione
  # anti-loop (2 fallimenti di fila = solo avviso) resta quella di watchdog.js.
  workflow_run:
    workflows: ["Vinted Deal Finder Bot"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Controlla stato bot, avvisa e riavvia se serve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEFAULT_BRANCH: main
          BOT_WORKFLOW: bot.yml
          # Da cron: aspetta 20 min prima di considerare il bot "fermo" (evita
          # falsi allarmi nel breve passaggio di consegne). Quando invece e' il
          # completamento di bot.yml a svegliare il watchdog, controlla subito
          # (GAP 0): se non c'e' gia' un run successivo in coda, riavvia adesso.
          GAP_MINUTES: ${{ github.event_name == 'workflow_run' && '0' || '20' }}
        run: node watchdog.js
