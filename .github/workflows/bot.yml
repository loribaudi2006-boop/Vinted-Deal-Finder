name: Vinted Deal Finder Bot

on:
  schedule:
    # Ogni 2 ore. Ogni job dura ~5h50m internamente (vedi run_loop.sh); grazie a
    # "concurrency" ne resta al massimo uno attivo + uno in attesa, che parte subito
    # quando il precedente finisce (buco quasi nullo). Cron ogni 2 ore: se GitHub
    # salta o ritarda molto un avvio programmato (succede spesso), quello dopo
    # recupera prima, e il watchdog copre comunque i buchi piu' lunghi.
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Storia completa: serve a run_loop.sh per fare 'git pull --rebase' del
          # salvataggio stato quando nel frattempo e' stato pushato altro codice.
          # Con il default (shallow, 1 commit) il rebase non trova la merge-base e
          # il salvataggio dello stato fallisce per tutta la durata del job.
          fetch-depth: 0

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm ci

      - name: Trova il percorso di Chrome
        id: chrome
        run: |
          CHROME_BIN=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium)
          echo "Chrome trovato in: $CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Avvia il loop (index.js ogni 60s; triage+analyze attaccati ogni 60s)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          chmod +x run_loop.sh
          ./run_loop.sh
